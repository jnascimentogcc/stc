[project]
name = "stc"
version = "0.1.0"
description = "Understand and query large collections of undocumented applications from their source code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "detect-secrets>=1.5",
    "pathspec>=0.12",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # tree-sitter 0.26.0 corrupts the heap on Windows (random access violations); stay below it.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-php>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
stc = "stc.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
