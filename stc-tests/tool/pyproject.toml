[project]
name = "stc-tests"
version = "0.0.1"
description = "AI-assisted tests for system migrations: reads the specifications STC writes and prepares the test work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "openai>=1.60",
    "typer>=0.15",
]

[project.scripts]
stc-tests = "stc_tests.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stc_tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
