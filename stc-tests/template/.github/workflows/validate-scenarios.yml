name: validate-scenarios

# Runs on every pull request that touches scenarios or specifications. No model, no STC, no target:
# only the Gherkin parser and the sidecars in specs/.
on:
  pull_request:
    paths:
      - "src/test/resources/features/**"
      - "specs/**"
      - "contract/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode test
